<header class="navbar">
    <div class="navbar-container">
        <!-- Logo & Nom -->
         <a href="#hero" class="navbar-logo">
            <span class="logo-icon">🏀</span>
            <span class="logo-text">LudwigPosn</span>
         </a>
        
         <!-- Menu de naviagation en mode Bureau -->
         <nav class="navbar-links">
            @for (link of navLinks; track link.label) {
                <a [href]="link.href" class="nav-link">{{ link.label }}</a>
            }
         </nav>

        <!-- Bouton CTA -->
        <div class="navbar-actions">
            <a href="#contact" class="btn gold">Contact Me</a>
        </div>

        <!-- Burger Menu pour la version mobile -->
        <button class="menu-toggle" (click)="toggleMenu()" aria-label="Menu">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </div>
</header>
