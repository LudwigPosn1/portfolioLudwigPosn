<header class="navbar">
  <div class="navbar-container">
    <!-- Logo ou Nom -->
    <a href="#hero" class="navbar-logo">
      <span class="logo-icon">🏀</span>
      <span class="logo-text">Portfolio<span class="highlight">.dev</span></span>
    </a>

    <div class="navbar-menu" [class.is-open]="isMenuOpen" id="navbar-menu">
      <nav class="navbar-links" aria-label="Navigation principale">
        @for (link of navLinks; track link.label) {
          <a [href]="link.href" class="nav-link" (click)="closeMenu()">{{ link.label }}</a>
        }
      </nav>

      <div class="navbar-action">
        <a href="#contact" class="btn-gold" (click)="closeMenu()">Me Contacter</a>
      </div>
    </div>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="navbar-menu"
      [attr.aria-label]="isMenuOpen ? 'Fermer le menu' : 'Ouvrir le menu'"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
