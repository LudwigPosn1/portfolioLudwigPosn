<header class="navbar">
  <div class="navbar-container">
    <!-- Logo ou Nom -->
    <a href="#hero" class="navbar-logo">
      <span class="logo-icon">🏀</span>
      <span class="logo-text">Portfolio<span class="highlight">.dev</span></span>
    </a>

    <!-- Menu de navigation Desktop -->
    <nav class="navbar-links">
      @for (link of navLinks; track link.label) {
        <a [href]="link.href" class="nav-link">{{ link.label }}</a>
      }
    </nav>

    <!-- Bouton CTA (Call to Action) -->
    <div class="navbar-action">
      <a href="#contact" class="btn-gold">Me Contacter</a>
    </div>

    <!-- Bouton Hamburger pour mobile (Optionnel / Extensible) -->
    <button class="menu-toggle" (click)="toggleMenu()" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
  </div>
</header>
